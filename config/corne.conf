# Corne ZMK Configuration
# Converted from Moonlander KOY Layout

# Enable deep sleep support (15 minutes)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse support (if available)
CONFIG_ZMK_MOUSE=y

# Debounce configuration for better responsiveness
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Increase BLE transmit power for better connectivity
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable USB logging (helpful for debugging)
# CONFIG_ZMK_USB_LOGGING=y

# Display support (if your Corne has a display)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# RGB Underglow (if your board supports it)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Combo configuration
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4
